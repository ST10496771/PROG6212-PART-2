name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDayApi.Tests/RaceDayApi.Tests.csproj

      - name: Build
        run: dotnet build RaceDayApi.Tests/RaceDayApi.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDayApi.Tests/RaceDayApi.Tests.csproj --no-build --configuration Release --verbosity normal
